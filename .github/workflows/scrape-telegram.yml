name: Scrape Telegram channels

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Cargar secrets Telegram (bloque .env o individuales)
        env:
          TELEGRAM_SCRAPER_DOTENV: ${{ secrets.TELEGRAM_SCRAPER_DOTENV }}
        run: |
          chmod +x scripts/load-dotenv-block.sh
          ./scripts/load-dotenv-block.sh
          {
            echo "TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}"
            echo "TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}"
            echo "TELEGRAM_USER_SESSION=${{ secrets.TELEGRAM_USER_SESSION }}"
            echo "EL_TOQUE_API_KEY=${{ secrets.EL_TOQUE_API_KEY }}"
          } >> "$GITHUB_ENV"
      - run: pnpm scrape:telegram
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
