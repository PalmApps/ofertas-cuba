name: Scrape Telegram channels

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Cargar secrets Telegram
        env:
          TELEGRAM_SCRAPER_DOTENV: ${{ secrets.TELEGRAM_SCRAPER_DOTENV }}
          S_TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          S_TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          S_TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
          S_EL_TOQUE_API_KEY: ${{ secrets.EL_TOQUE_API_KEY }}
        run: |
          chmod +x scripts/load-dotenv-block.sh
          if [ -n "$TELEGRAM_SCRAPER_DOTENV" ]; then
            ./scripts/load-dotenv-block.sh
          fi
          set_if_empty() {
            local key="$1" val="$2"
            if [ -n "$val" ] && [ -z "${!key:-}" ]; then
              echo "${key}=${val}" >> "$GITHUB_ENV"
            fi
          }
          set_if_empty TELEGRAM_API_ID "$S_TELEGRAM_API_ID"
          set_if_empty TELEGRAM_API_HASH "$S_TELEGRAM_API_HASH"
          set_if_empty TELEGRAM_USER_SESSION "$S_TELEGRAM_USER_SESSION"
          set_if_empty EL_TOQUE_API_KEY "$S_EL_TOQUE_API_KEY"
      - name: Verificar secrets Telegram (GitHub Actions)
        run: |
          if [ -z "${TELEGRAM_API_ID:-}" ] || [ -z "${TELEGRAM_API_HASH:-}" ] || [ -z "${TELEGRAM_USER_SESSION:-}" ]; then
            echo "::error::Secrets de Telegram vacíos en GitHub Actions."
            echo "Si los pusiste en Vercel, no aplican aquí."
            echo "Opción A: Vercel → Settings → Environment Variables (Production)"
            echo "         luego abre https://ofertascuba.vercel.app/api/cron/scrape-telegram?secret=TU_CRON_SECRET"
            echo "Opción B: GitHub → Settings → Secrets → Actions → TELEGRAM_SCRAPER_DOTENV"
            exit 1
          fi
          echo "Secrets Telegram OK en GitHub Actions."
      - run: pnpm scrape:telegram
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EL_TOQUE_API_KEY: ${{ env.EL_TOQUE_API_KEY }}
          TELEGRAM_API_ID: ${{ env.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ env.TELEGRAM_API_HASH }}
          TELEGRAM_USER_SESSION: ${{ env.TELEGRAM_USER_SESSION }}
