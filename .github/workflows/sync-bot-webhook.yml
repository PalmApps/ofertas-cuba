name: Sync bot webhook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/src/app/api/telegram/**"
      - "apps/bot/**"
      - "scripts/set-bot-webhook.ts"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bot:webhook:set
        env:
          TELEGRAM_OFERTAS_BOT_TOKEN: ${{ secrets.TELEGRAM_OFERTAS_BOT_TOKEN }}
          NEXT_PUBLIC_APP_URL: https://ofertascuba.vercel.app
